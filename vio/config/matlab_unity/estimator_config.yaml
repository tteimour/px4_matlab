%YAML:1.0 # need to specify the file type at the top!

# OpenVINS config for the MATLAB-sim + Unity/Cesium pipeline (OBSERVER mode).
#   camera : Unity NavCamera  -> /down_cam/image_raw (512x512, 66 deg FOV, mono)
#   imu    : px4_matlab IMU    -> /vio_imu/data (200 Hz, body FRD)
# Derived from config/px4_sitl by swapping the camera/IMU sources. See the two
# kalibr_*.yaml files in this directory for the per-sensor parameters.

verbosity: "INFO" # ALL, DEBUG, INFO, WARNING, ERROR, SILENT

use_fej: true # if first-estimate Jacobians should be used (enable for good consistency)
integration: "rk4" # discrete, rk4, analytical
use_stereo: false # mono camera — Unity NavCamera only
max_cameras: 1 # mono mode for the downward-facing camera

calib_cam_extrinsics: true # refine T_imu_cam online — IMPORTANT, the initial R_CtoI is an unverified guess
calib_cam_intrinsics: false # Unity pinhole intrinsics are known exactly (66 deg FOV)
calib_cam_timeoffset: true # absorb the small constant camera/IMU offset (pose stamp lags state by ~dt_frame)
calib_imu_intrinsics: false # not needed for simulation
calib_imu_g_sensitivity: false # not needed for simulation

max_clones: 11
max_slam: 50
max_slam_in_update: 25
max_msckf_in_update: 10
dt_slam_delay: 2

gravity_mag: 9.8066 # matches px4_matlab EarthModel gravity

feat_rep_msckf: "GLOBAL_3D"
feat_rep_slam: "GLOBAL_3D"
feat_rep_aruco: "GLOBAL_3D"

# zero velocity update parameters
try_zupt: true # enable ZUPT for better handling of stationary startup
zupt_chi2_multipler: 1
zupt_max_velocity: 0.1
zupt_noise_multiplier: 1
zupt_max_disparity: 0 # imu-based ZUPT
zupt_only_at_beginning: false

# ==================================================================
# Initialization parameters
# ==================================================================

init_window_time: 2.0
init_imu_thresh: 1.0
init_max_disparity: 1.5
init_max_features: 15

init_dyn_use: true # dynamic init (matches the working Gazebo config); needs healthy camera fps
init_dyn_mle_opt_calib: false
init_dyn_mle_max_iter: 50
init_dyn_mle_max_time: 0.5
init_dyn_mle_max_threads: 6
init_dyn_num_pose: 6
init_dyn_min_deg: 5.0

init_dyn_inflation_ori: 10
init_dyn_inflation_vel: 100
init_dyn_inflation_bg: 10
init_dyn_inflation_ba: 100
init_dyn_min_rec_cond: 1e-15

init_dyn_bias_g: [0.0, 0.0, 0.0] # gyro bias guess
init_dyn_bias_a: [0.0, 0.0, 0.0] # accel bias guess (MATLAB IMU turn-on bias is zero-mean)

# ==================================================================
# Output / logging
# ==================================================================

record_timing_information: false
record_timing_filepath: "/tmp/traj_timing.txt"

save_total_state: false
filepath_est: "/tmp/ov_estimate.txt"
filepath_std: "/tmp/ov_estimate_std.txt"
filepath_gt: "/tmp/ov_groundtruth.txt"

# ==================================================================
# Feature tracking parameters
# ==================================================================

use_klt: true
num_pts: 300        # more features (was 200) -- robustness vs feature starvation
fast_threshold: 10  # detect more corners on low-contrast aerial imagery (was 15)
grid_x: 16 # 512 px width
grid_y: 16 # 512 px height (square render)
min_px_dist: 10     # allow slightly denser features (was 12)
knn_ratio: 0.70
# Unity NavCamera streams at 30 fps (Quba.unity streams fps:30). Actual delivery
# rate depends on rosbridge throughput; expect 10-30 Hz depending on system load.
track_frequency: 30.0
downsample_cameras: false
num_opencv_threads: 4
histogram_method: "CLAHE" # CLAHE: contrast-equalize low-contrast aerial imagery (was HISTOGRAM)

# aruco tag tracker — disabled
use_aruco: false
num_aruco: 1024
downsize_aruco: true

# ==================================================================
# Measurement noise
# ==================================================================

up_msckf_sigma_px: 1
up_msckf_chi2_multipler: 1
up_slam_sigma_px: 1
up_slam_chi2_multipler: 1
up_aruco_sigma_px: 1
up_aruco_chi2_multipler: 1

use_mask: false

# imu and camera spacial-temporal config files (relative to this file's directory)
relative_config_imu: "kalibr_imu_chain.yaml"
relative_config_imucam: "kalibr_imucam_chain.yaml"
